name: Fork Linux Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release summary for this build (Markdown, optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fork-linux-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      T3CODE_TELEMETRY_CHANNEL: dev
      VITE_RELEASE_CHANNEL: preview
    steps:
      - name: Checkout
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build and launch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick xvfb

      - name: Resolve release version
        id: version
        run: |
          base=$(node -p 'require("./apps/desktop/package.json").version')
          version="${base}-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=fork-v$version" >> "$GITHUB_OUTPUT"
          node scripts/update-release-package-versions.ts "$version"
          cp .env.example .env

      - name: Build Linux AppImage and Deb
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          vp run dist:desktop:artifact \
            --platform linux --target AppImage --arch x64 \
            --build-version "$RELEASE_VERSION" --output-dir release --verbose

      - name: Check packaged application starts
        run: |
          appimage=$(realpath release/*.AppImage)
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          xvfb-run -a node scripts/smoke-desktop-app.ts \
            --executable "$RUNNER_TEMP/squashfs-root/t3code" \
            --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"

      - name: Upload launch diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-launch-check
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          (cd release && sha256sum *.AppImage *.deb > SHA256SUMS)
          previous_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          {
            echo "Linux x64 build from the T3 Code fork."
            echo
            if [ -n "$RELEASE_NOTES" ]; then
              echo "## What's new"
              echo
              printf '%s\n\n' "$RELEASE_NOTES"
            fi
            echo "## Downloads"
            echo
            echo "- Debian/Ubuntu: the `.deb` asset."
            echo "- Other Linux distributions: the `.AppImage` asset."
            echo "- Verify downloads against `SHA256SUMS`."
            echo
            echo "## Qoder CN provider preset"
            echo
            echo "This fork includes the Qoder CN provider preset. Open Settings → Providers → Add provider → Show more → Qoder CN, install the Qoder CN CLI on the T3 server, and run \`qodercn login\` before starting a thread."
            echo
            echo "This is an unsigned fork prerelease. The packaged application passed the desktop launch check."
            echo
            echo "Source commit: $GITHUB_SHA"
            if [ -n "$previous_tag" ]; then
              echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_SHA"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release/*.AppImage release/*.deb release/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "T3 Code $RELEASE_VERSION — Linux x64" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
